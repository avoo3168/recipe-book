<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="My personal recipe book.">
  <title>Recipe Book</title>
  <script>
    // Apply a saved light/dark choice before the page paints (see js/theme.js).
    try {
      var theme = localStorage.getItem("recipe-book:theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="site-header no-print">
    <div class="container header-inner">
      <a href="#/" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/>
            <path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>
            <path d="M9 8h7M9 12h5"/>
          </svg>
        </span>
        <span class="brand-text">Recipe Book</span>
      </a>

      <label class="search">
        <span class="visually-hidden">Search recipes</span>
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="search" type="search" placeholder="Search recipes or ingredients" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
        <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" title="Clear search" hidden>✕</button>
      </label>

      <nav class="site-nav" aria-label="Main">
        <a href="#/" data-nav="list" class="nav-recipes">Recipes</a>
        <a href="#/collections" data-nav="collections" title="Collections">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/>
          </svg>
          <span class="nav-label">Collections</span>
        </a>
        <a href="#/grocery" data-nav="grocery">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1"/><circle cx="17" cy="20.5" r="1"/>
          </svg>
          <span class="nav-label">Grocery list</span>
          <span id="grocery-count" class="badge" hidden></span>
        </a>
        <a href="#/new" data-nav="new" class="btn btn-primary btn-small">+ <span class="nav-label">Add recipe</span></a>
        <button type="button" id="theme-toggle" class="nav-icon">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
        <a href="#/settings" data-nav="settings" class="nav-icon" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
          </svg>
        </a>
      </nav>
    </div>
  </header>

  <div class="container no-print">
    <div id="load-warning" class="banner banner-warning" role="status" hidden></div>
  </div>

  <main id="view" class="container" tabindex="-1">
    <p class="loading">Loading recipes…</p>
  </main>

  <footer class="site-footer no-print">
    <div class="container">
      Recipes are stored in <a href="data/recipes.csv">data/recipes.csv</a>, <a href="data/ingredients.csv">ingredients.csv</a>, and <a href="data/recipe_ingredients.csv">recipe_ingredients.csv</a>.
    </div>
  </footer>

  <datalist id="ingredient-options"></datalist>
  <datalist id="category-options"></datalist>
  <div id="toast" class="toast no-print" role="status" aria-live="polite" hidden></div>
</body>
</html>
