<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="My personal recipe book.">
  <title>Recipe Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/>
            <path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>
            <path d="M9 8h7M9 12h5"/>
          </svg>
        </span>
        <span class="brand-text">Recipe Book</span>
      </a>

      <label class="search">
        <span class="visually-hidden">Search recipes</span>
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="search" type="search" placeholder="Search recipes or ingredients" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </label>
    </div>
  </header>

  <main id="view" class="container" tabindex="-1">
    <p class="loading">Loading recipes…</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      Recipes load from <a href="data/recipes.csv">data/recipes.csv</a>.
    </div>
  </footer>
</body>
</html>
